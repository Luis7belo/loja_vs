<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contato.css">
    <title>Nexora Store - Contato</title>
</head>
<header class="cabecalho">
<div class="logo">
    <a href="inicial.html">
        <img src="imagens/Logo1.png" width="150" height="0">
    </a>    
</div>
    <button class="link"><a href="inicial.html">Página Inicial</a></button>
    <button class="link"><a href="produtos.html">Produtos</a></button>
    <button class="link"><a href="sobre.html">Sobre</a></button>
    <button class="link"><a href="contato.html">Contato</a></button>    
</header>
<body>
     <div class="conteudo">
            <h1>Entre em contato</h1>
            <p>Tem alguma dúvida, sugestão ou precisa de ajuda? Envie uma mensagem para nossa equipe.</p>
            <form>
                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                >
                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto">
                    <option value="">Selecione um assunto</option>
                    <option value="duvida">Dúvida</option>
                    <option value="pedido">Pedido</option>
                    <option value="problema">Problema</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="outro">Outro</option>

                </select>
                <label for="mensagem">Mensagem:</label>
                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="6"
                    placeholder="Digite sua mensagem..."
                    required
                ></textarea>
                <button type="submit" class="botao-enviar">
                    Enviar mensagem
                </button>
            </form>
        </div>
</body>
</html>
